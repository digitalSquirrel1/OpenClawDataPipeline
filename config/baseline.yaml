# 实际运行时读取的是baseline_using.yaml，任何配置修改请在baseline_using.yaml进行

api_config:
  LLM_API_KEY: "sk-xxx"
  LLM_BASE_URL: "https://api.xxx.com/v1"
  LLM_MODEL: "gemini-3-flash-preview" # 或 gpt-5.2
  LLM_PROXY: null
  LLM_BACKEND: "openai" # openai | anthropic

web_tools_config:
  SERPER_KEY: "xxx"
  JINA_KEY: "jina_xxx"

pipeline_config: # main.py 运行参数
  MAX_LLM_CALLS: 50
  MAX_WORKERS: 10
  USER_PROFILE_PATH: "user_profile.txt"
  OUTPUT_DIR: "output"

generate_user_profile_config: # 生成 user profile
  PROFILE_GENERATION_PROMPT: "prompts/profile_generation_prompt.md"
  profiles_dir: "Outputs/260331/profiles" # null -> Outputs/profiles
  count: 400

batch_generate_config: # 根据 user_profile 生成 environment
  profiles_dir: "Outputs/260331/profiles" # null -> Outputs/profiles
  envs_dir: "Outputs/260331/environments" # 相对于 user_simulator_agent/
  WINDOWS_MAP_RATIO: 0.3 # 生成 MAP_Windows.json 的概率，1-该值为 MAP_Linux.json 概率
  # overwrite_existing: true # 打开后会覆盖已生成结果
  queries_dir: null   # queries JSON 目录，null 为 LLM 自由发挥模式
                      # 示例: "Outputs/260327/queries_with_skills_noenv"

convert_env_maps_confg: # 批量转换 MAP 文件（按你的现有代码键名）
  envs_dir: "Outputs/260331/environments"
  convert_to_linux: true

profile_analyzer_config:
  PROMPT_TMPL: "prompts/profile_analyzer_prompt.md"

computer_spec_designer_config:
  PROMPT_DIRS: "prompts/computer_spec_dirs.md"
  PROMPT_DIRS_LINUX: "prompts/computer_spec_dirs_linux.md"
  PROMPT_PDF: "prompts/computer_spec_pdf.md"
  PROMPT_HTML: "prompts/computer_spec_html.md"
  PROMPT_EXCEL_CSV: "prompts/computer_spec_excel_csv.md"
  PROMPT_DOCX: "prompts/computer_spec_docx.md"
  PROMPT_XLSX: "prompts/computer_spec_xlsx.md"
  PROMPT_MD: "prompts/computer_spec_md.md"
  PROMPT_IMAGE: "prompts/computer_spec_image.md"
  PROMPT_VIDEO: "prompts/computer_spec_video.md"
  PROMPT_AUDIO: "prompts/computer_spec_audio.md"
  PROMPT_FILE_COUNTS: "prompts/computer_spec_file_counts.md"
  PROMPT_ENVCONFIG: "prompts/computer_spec_envconfig.md"
  PROMPT_ENVCONFIG_LINUX: "prompts/computer_spec_envconfig_linux.md"

user_agent_builder_config:
  PROMPT_TMPL: "prompts/user_agent_builder_prompt.md"

user_query_generator_config:
  PROMPT_TMPL: "prompts/user_query_generate_prompt.md"

query_gen_with_topic_skill_profile_config:
  topics_txt_path: "Examples/topics.txt" # topics 文件路径（相对项目根目录）
  profiles_dir: "Outputs/260327/profiles" # 用户 profile 目录
  envs_dir: "Outputs/260327/environments" # null 表示不读取环境信息
  output_dir: "Outputs/260327/queries_skill_env"
  num_user_per_topic: null # null 表示使用全部 profile
  queries_per_combination: 6
  num_calls: 1
  detailed_query_ratio: 0.2
  simple_query_ratio: 0.2
  skip_existing: true
  use_match_skills: true
  path_discription_abs_ratio_win: [0.6, 0.25, 0.15]
  path_discription_prompt_win: ["prompts/path_discription_prompt_abs_win.md", "prompts/path_discription_prompt_entire.md", "prompts/path_discription_prompt_partial_win.md"]
  path_discription_abs_ratio_linux: [0.6, 0.25, 0.15]
  path_discription_prompt_linux: ["prompts/path_discription_prompt_abs_linux.md", "prompts/path_discription_prompt_entire.md", "prompts/path_discription_prompt_partial_linux.md"]
  PROMPT_TMPL: "prompts/query_gen_with_topic_skill_profile_prompt.md"
  PROMPT_TMPL_ENV: "prompts/query_gen_with_topic_skill_profile_env_prompt.md"
  PROMPT_TMPL_ENV_LINUX: "prompts/query_gen_with_topic_skill_profile_env_linux_prompt.md"

