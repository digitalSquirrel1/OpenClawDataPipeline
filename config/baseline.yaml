generate_config: # generate_configs.py 批量生成 AutomationConfig
  input: "Outputs/260327/env_configs/linux_260331/environments"
  output: "Outputs/260327/env_configs/linux_260331/configs"
  skill_dir: "skill_localize/skills_library"
  agent_dir: "/home/ma-user/workspace/openclaw-task/agents"
  simulator_config: "configs/user_proxy_model.json"
  workspace: "~/.openclaw/workspace"
  model: "claude-3-5-sonnet"
  gateway_ws_url: "ws://127.0.0.1:18789/gateway"
  api_key: null
  timeout: 3600
  copy_map_not_workspace_ratio: 0.5
  agents_config: ["TOOLS.md"] # 需要从agent_dir复制到workspace里面的agent设定文件名，没有就写[]
