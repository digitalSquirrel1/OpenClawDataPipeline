skill_reviewer_config:
  target_dir: "Outputs/skill_localize/skills_library"
  concurrency: 50
  output: "Examples/skills_review.json"

topic_search_skills_config:
  skills_json_path: "Examples/skills_review.json" # "Examples/skills.json"
  topic_to_skills_map: null # null -> 默认同目录 skills_index.json
  skills_dir: "Outputs/skill_localize/skills_library" # 或 Examples/skills_library
  max_skills_per_topic: 18

standard_format_config: # 有env打包，标准格式化打包，直接写入 envs_dir
  info_dir: "Outputs/260327/queries_skill_env"
  output_dir: null # 使用 envs_dir 时应为 null
  profiles_dir: "Outputs/260327/profiles"
  envs_dir: "Outputs/260327/environments" # 与 output_dir 互斥
  skills_dir: null

